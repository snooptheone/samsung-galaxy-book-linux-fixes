PACKAGE_NAME="samsung-galaxybook-960xgl"
PACKAGE_VERSION="1.0"
BUILT_MODULE_NAME[0]="samsung-galaxybook"
DEST_MODULE_LOCATION[0]="/updates"
AUTOINSTALL="yes"
# The .c is a copy of the Linux 7.2.x driver. On other kernel series DKMS skips
# the build and the in-tree driver stays in place (only Fn+Esc is lost).
BUILD_EXCLUSIVE_KERNEL="^7\.2\."
