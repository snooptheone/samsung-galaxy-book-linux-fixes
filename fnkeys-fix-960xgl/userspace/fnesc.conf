# Command run when Fn+Esc is pressed, as the user logged in on seat0.
# It runs through `sh -c` with XDG_RUNTIME_DIR and DBUS_SESSION_BUS_ADDRESS set,
# so D-Bus and `systemctl --user` work. WAYLAND_DISPLAY/DISPLAY are NOT set:
# to start a graphical app, wrap it in a user service instead.
#
# Examples:
#   FNESC_COMMAND='wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle'
#   FNESC_COMMAND='systemctl --user start my-support-app.service'
#
# Empty = only write a line to the journal (journalctl -t samsung-galaxybook-fnesc).
FNESC_COMMAND=""
